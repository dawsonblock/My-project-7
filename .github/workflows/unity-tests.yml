name: Unity Tests

# Requires a Unity license. For Personal licenses, run once with
# game-ci/unity-activate to produce UNITY_LICENSE (and UNITY_EMAIL /
# UNITY_PASSWORD) repository secrets. See https://game.ci/docs.

on:
  push:
    branches: [main, stabilization/*]
  pull_request:
    branches: [main]

jobs:
  test:
    name: EditMode + PlayMode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: game-ci/unity-test-runner@v4
        with:
          testMode: all
          checkName: Unity Test Results
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

  verify-generation:
    name: Deterministic generation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneOSX
          # BuildAll.Run regenerates all scenes/prefabs before any build;
          # run it twice via a dedicated check method in CI.
          buildMethod: Escape.EditorTools.CiChecks.VerifyDeterministicGeneration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

  # Standalone qualification: a macOS runner, because the shipping target is
  # StandaloneOSX. The Linux jobs above cannot produce or launch that player.
  player-build-and-smoke:
    name: Standalone player build + gameplay smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneOSX
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      # The built player runs a deterministic qualification pass
      # (scene transitions, progression chain, save round-trip) and exits
      # non-zero on failure — see Assets/_Game/Core/Bootstrap/GameSmokeTest.cs
      - name: Smoke test the built player
        run: ./ci/smoke-player.sh "$(find builds -maxdepth 3 -name '*.app' | head -1)"

      - name: Upload player smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-smoke-log
          path: Logs/ci-smoke.log
          if-no-files-found: ignore
